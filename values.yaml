versitygw:
  enabled: false
  strategy:
    type: Recreate
  auth:
    accessKey: myaccesskey
    secretKey: mysecretkey
  # serviceAccount:
  #   create: true
  #   name: airflow-versitygw-s3
  admin:
    enabled: true
  webui:
    enabled: true
    apiGateways:
      - http://localhost:7070
    adminGateways:
      - http://localhost:7071
  gateway:
    region: eu-central-1
    backend:
      type: posix
      # https://github.com/versity/versitygw/discussions/1551#discussioncomment-16508001
      # and https://github.com/versity/versitygw/commit/568d4a25ccc60b4283c52d20be5e416976521393
      # Add sidecar dir to avoid `xattr check failed: xattrs are not supported on this filesystem`
      # but be aware of https://github.com/versity/versitygw/wiki/POSIX-metadata
      sidecarDir: "/mnt/metadata"
  sidecar:
    enabled: true
  # ingress:
  #   enabled: true
  #   annotations:
  #     nginx.ingress.kubernetes.io/use-regex: "true"
  #     nginx.ingress.kubernetes.io/rewrite-target: /$2
  #   hosts:
  #     - paths:
  #       - path: /s3webui(/|$)(.*)
  #         pathType: ImplementationSpecific
  #         servicePort: webui
  #       - path: /s3(/|$)(.*)
  #         pathType: ImplementationSpecific
  #         servicePort: s3-api

fuseki:
  enabled: true
  image:
    repository: ghcr.io/white-gecko/fuseki-geosparql
    tag: main
  volumeMounts:
    - mountPath: /fuseki/configuration/config.ttl
      name: config-ttl
      subPath: "config.ttl"
      readOnly: true
  volumes:
    - name: config-ttl
      configMap:
        name: fuseki-configmap
        items:
          - key: "config.ttl"
            path: "config.ttl"
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - paths:
        - path: /fuseki(/|$)(.*)
          pathType: ImplementationSpecific

graph:
  enabled: false

ingest:
  enabled: false

mockils:
  enabled: true

outbackcdx:
  enabled: true
  pvcName: cdx-pvc

playback:
  enabled: true

pwidresolver:
  enabled: true

wacalog:
  enabled: true
  # insert the output of `minikube ip` as host part.
  playbackBase: "/wayback/warcs/"
  mkrdf:
    sparqlEndpoint: "http://webarchive-fuseki:3030/ds/query"
    baseIri: "https://d-nb.info/webarchive/"
    homeIri: "https://d-nb.info/webarchive/"

dashboard:
  enabled: true

vpa:
  enabled: true
  updateMode: "Off"

airflowConnections:
  - name: fuseki-query-secret
    connectionId: sparql_query_default
    config:
      conn_type: http
      host: webarchive-fuseki
      port: "3030"
      schema: ds/query

  - name: fuseki-update-secret
    connectionId: sparql_update_default
    config:
      conn_type: http
      host: webarchive-fuseki
      port: "3030"
      schema: ds/update
      login: admin
    tplConfig: |
      password: {{ .Values.fuseki.config.adminPassword | quote }}

  - name: aras-secret
    connectionId: aras_default
    config:
      conn_type: http
      host: mockils-service
      port: "8080"

  - name: outbackcdx-secret
    connectionId: cdx_default
    config:
      conn_type: http
      host: outbackcdx-service
      port: "8080"
      schema: outbackcdx

  - name: s3-secret
    connectionId: aws_default
    config:
      conn_type: aws
      extra:
        endpoint_url: http://webarchive-versitygw:7070
    tplConfig: |
      login: {{ .Values.versitygw.auth.accessKey | quote }}
      password: {{ .Values.versitygw.auth.secretKey | quote }}
      extra:
        region_name: {{ .Values.versitygw.gateway.region | default "eu-central-1" | quote }}
    # From somewhere there was the info, the credentials need to go to extra: extra.aws_access_key_id, extra.aws_secret_access_key, but I think login and password are right.
    # maybe "endpoint_url_s3": "http://webarchive-versitygw:7070"