global:
  imagePullPolicy: IfNotPresent

airflow:
  enabled: true
  airflowVersion: "3.3.2"
  defaultAirflowTag: "3.3.2"
  dags:
    persistence:
      enabled: true
      existingClaim: dags-pvc
    gitSync:
      enabled: false
  # issue: https://github.com/apache/airflow/issues/58417
  config:
    core:
      hostname_callable: airflow.utils.net.get_host_ip_address
    secrets:
      backend: airflow.providers.cncf.kubernetes.secrets.kubernetes_secrets_backend.KubernetesSecretsBackend

