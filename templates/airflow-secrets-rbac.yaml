{{- if .Values.airflow.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-secrets-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
  # Note: No resourceNames specified, but the Kubernetes secrets backend
  # will filter by label selector: airflow.apache.org/connection-id

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-secrets-reader-binding
subjects:
- kind: ServiceAccount
  name: webarchive-airflow-scheduler
- kind: ServiceAccount
  name: webarchive-airflow-worker
roleRef:
  kind: Role
  name: airflow-secrets-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}